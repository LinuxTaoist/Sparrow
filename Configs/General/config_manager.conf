# ConfigManagerSrv runtime config
# format:
#   config.db_path=/path/to/db
#   config.backup_path=/path/to/backup
#   config.seed.<scope>=<namespace>|<key>|<value>
# scopes: default / factory / user

# storage
config.db_path      = /tmp/config_manager.db
config.backup_path  = /tmp/config_manager.db.bak

# seed values (namespace|key|value)
# default layer: final fallback
config.seed.default = cloud|retry_interval_sec|30
config.seed.default = net|apn|default_apn

# factory layer: higher than default
config.seed.factory = device|region|CN
config.seed.factory = net|apn|factory_apn
