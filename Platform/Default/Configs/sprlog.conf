[output.default]                            # 默认输出
frame_length_bytes  = 1024                  # 单条日志帧最大长度，单位：字节
enabled             = true                  # 是否启用日志输出
level               = debug                 # 日志级别：error、warn、info、debug
output              = file                  # 输出方式：file、stdout
log_dir             = /tmp/sprlog/main      # 日志目录
file_name           = main.log              # 日志文件名
file_name_format    = BN_ST.FX              # 日志文件名格式: BN：基础名称，FX：文件扩展名，ST：本地时间戳，SI: 系统启动短标识，MH: 进程单调时间戳
file_num            = 10                    # 保留日志文件数量
file_capacity_mb    = 10                    # 单个日志文件最大容量，单位：MB
flush_count         = 64                    # 累积日志条数达到该值时刷新
flush_interval_ms   = 1000                  # 定时刷新间隔，单位：毫秒
pack_enabled        = true                  # 是否启用轮转日志打包
pack_name           = main                  # 打包文件名
pack_dir            = /tmp/sprlog/main/pack # 打包日志目录，留空时回退到 log_dir
pack_name_format    = BN_ST.FX              # 打包日志文件名格式，轮转序号会插入到最后一个扩展名前
pack_type           = tar.gz                # 打包类型，内置支持：tar.gz、zip
pack_command_override =                     # 自定义归档/压缩命令模板，支持 {src} {dst} {dir} {name} 以及批量占位符 {src_list} {name_list}，非空时覆盖 pack_type
                                            # 例 tar.gz: tar -czf "{dst}" -C "{dir}" {name_list}
pack_file_num       = 10                    # 打包日志保留数量，主约束
pack_total_size_mb  = 100                   # 打包日志总空间上限，辅助约束，0 表示不限制

